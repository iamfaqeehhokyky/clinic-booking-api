services:
  - type: web
    name: clinic-booking-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-booking-db
          property: connectionString
      - key: API_KEY
        generateValue: true

databases:
  - name: clinic-booking-db
    plan: free
